name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type and Svelte checks
        run: pnpm check

      - name: Generated docs are current
        run: pnpm docs:check

      - name: Unit tests
        run: pnpm test

      - name: Telemetry smoke
        run: pnpm telemetry --seeds 1 --ticks 300

      - name: Formatting
        run: pnpm lint

      - name: Production build
        run: pnpm build

      - name: Built worker smoke
        run: pnpm test:worker
